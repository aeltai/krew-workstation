services:
  rancher:
    image: rancher/rancher:latest
    privileged: true
    ports:
      - "8089:80"
      - "8449:443"
    volumes:
      - rancher-data:/var/lib/rancher
    environment:
      - CATTLE_BOOTSTRAP_PASSWORD=admin
    command:
      - --no-cacerts

  krew-backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    ports:
      - "9000:3000"
    hostname: deathstar
    environment:
      - RANCHER_URL=https://rancher:443
      - RANCHER_TOKEN=${RANCHER_TOKEN:-}
      - WORKSTATION_USER=stormtrooper
      - WORKSTATION_HOST=deathstar
      # ALLOW_SERVICE_TOKEN=false  # production: require per-user Rancher session token only
    volumes:
      - krew-data:/root/.krew
      - ssh-keys:/root/.ssh
      - ./.local-plugins:/opt/local-plugins:ro
    depends_on:
      - rancher
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.22-rootless
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__ROOT_URL=http://localhost:3001/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2222
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__security__INSTALL_LOCK=true
    ports:
      - "3001:3000"
      - "2222:2222"
    volumes:
      - gitea-data:/data
    restart: unless-stopped

volumes:
  rancher-data:
  krew-data:
  ssh-keys:
  gitea-data:
