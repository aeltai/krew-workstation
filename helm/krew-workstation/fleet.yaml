defaultNamespace: krew-system
helm:
  releaseName: krew-workstation
  takeOwnership: true
  createNamespace: false
  values:
    imagePullSecrets:
      - name: ghcr-pull
    podSecurityContext:
      runAsNonRoot: false
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
    image:
      repository: ghcr.io/aeltai/krew-workstation
      tag: latest
    rancher:
      url: https://rancher.cattle-system.svc
      existingSecret:
        name: krew-workstation-rancher
        tokenKey: token
        publicHostKey: publicHost
    uiPlugin:
      enabled: true
      endpoint: https://aeltai.github.io/krew-workstation/extensions/krew/0.1.0/plugin
    persistence:
      enabled: false
